<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Five night's Under Ground: survival horror in una pizzeria abbandonata sotto terra.">
<title>Five night's Under Ground</title>
<style>
:root{
  --soot:#060705;
  --sodium:#d9982f;
  --rust:#8e2a1c;
  --crt:#86b8ab;
  --bone:#d9cfb7;
  --bone-dim:#9d9582;
  --line:#34382c;
  --display:Impact,Haettenschweiler,"Arial Narrow Bold","Franklin Gothic Medium",sans-serif;
  --body:Georgia,"Times New Roman",serif;
  --mono:"Courier New",Courier,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--soot);color:var(--bone);overflow:hidden;font-family:var(--body)}
#game{position:fixed;inset:0;display:block;width:100vw;height:100vh;touch-action:none;background:var(--soot)}
button,select{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sodium);outline-offset:3px}

/* ---------- schermate (menu / backstage) ---------- */
.screen{position:fixed;inset:0;pointer-events:none;z-index:5;transition:opacity .6s ease,visibility 0s linear 0s}
.screen.hidden{opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s linear .5s}
.screen>*{pointer-events:auto}
#title{position:absolute;left:clamp(16px,5vw,92px);top:clamp(16px,6.5vh,76px);font-family:var(--display);font-weight:400;line-height:.86;transform:rotate(-2.2deg);transform-origin:left top;user-select:none;pointer-events:none}
#title .t1{display:block;font-size:clamp(24px,3.3vw,52px);letter-spacing:.07em;color:var(--bone);text-shadow:0 2px 0 #000,0 0 20px rgba(0,0,0,.95)}
#title .t2{display:block;white-space:nowrap;font-size:clamp(44px,7.4vw,122px);letter-spacing:.01em;color:var(--sodium);text-shadow:0 0 26px rgba(217,152,47,.32),0 3px 0 #2a1806;-webkit-mask-image:linear-gradient(to bottom,#000 52%,rgba(0,0,0,.14) 100%);mask-image:linear-gradient(to bottom,#000 52%,rgba(0,0,0,.14) 100%)}
#title .t2 span{display:inline-block}
#title .soil{display:block;height:clamp(6px,.9vw,12px);margin-top:.12em;width:105%;background:linear-gradient(#1d170f,#0b0906);border-radius:40% 60% 50% 45%/60% 50% 50% 40%}
.flk{animation:flk 7.3s infinite steps(1)}
@keyframes flk{0%,100%{opacity:1}41%{opacity:.2}42%{opacity:1}44%{opacity:.45}45%{opacity:1}79%{opacity:.6}80%{opacity:1}}
.tilted{position:absolute;left:clamp(16px,5vw,92px);top:clamp(180px,33vh,340px);display:flex;flex-direction:column;gap:clamp(14px,2.6vh,28px);perspective:760px}
.tilted button{--i:0;position:relative;margin-left:calc(var(--i) * 7px);transform-origin:left center;transform:rotateY(22deg);text-align:left;font-family:var(--display);font-size:clamp(18px,2vw,30px);letter-spacing:.08em;color:var(--bone);padding:.2em 1.6em .14em .6em;width:max-content;min-width:clamp(180px,17vw,270px);background:linear-gradient(90deg,rgba(24,27,21,.94),rgba(24,27,21,.6) 70%,rgba(24,27,21,0));border-left:4px solid #4a4a3a;text-shadow:0 2px 0 #000;transition:transform .4s cubic-bezier(.2,.8,.2,1),color .2s,border-color .2s}
.tilted button::after{content:"";position:absolute;left:-4px;top:0;bottom:0;width:4px;box-shadow:0 0 16px 2px var(--sodium);opacity:0;transition:opacity .25s}
.tilted button:hover,.tilted button:focus-visible{transform:rotateY(9deg) translateX(14px);color:var(--sodium);border-left-color:var(--sodium);outline:none}
.tilted button:hover::after,.tilted button:focus-visible::after{opacity:1}
#sig{position:absolute;left:clamp(14px,2.2vw,30px);bottom:clamp(12px,2.2vh,24px);font-family:var(--mono);font-size:14px;color:var(--bone-dim);letter-spacing:.03em;pointer-events:none}
#hint{position:fixed;z-index:6;left:50%;bottom:clamp(64px,9vh,90px);transform:translateX(-50%);font-size:14px;color:var(--bone-dim);font-style:italic;pointer-events:none;animation:pulse 2.6s ease-in-out infinite;white-space:nowrap}
#hint.gone{display:none}
@keyframes pulse{50%{opacity:.35}}

/* backstage */
#backstage .head{position:absolute;left:clamp(16px,5vw,92px);top:clamp(18px,7vh,80px);max-width:min(560px,86vw);pointer-events:none}
#backstage h2{font-family:var(--display);font-weight:400;font-size:clamp(40px,6vw,92px);line-height:.9;color:#c2482f;letter-spacing:.02em;text-shadow:0 0 30px rgba(194,72,47,.3),0 3px 0 #1a0604}
#backstage .head p{margin-top:12px;font-style:italic;color:var(--bone-dim);line-height:1.5;max-width:44ch;text-shadow:0 1px 6px #000}
#bsBtns{top:clamp(200px,32vh,350px);gap:clamp(20px,3.4vh,36px)}
#bsBtns button{display:flex;flex-direction:column;gap:2px;padding:.35em 1.6em .3em .7em}
#bsBtns button small{font-family:var(--body);font-size:clamp(12px,1vw,15px);letter-spacing:0;color:var(--bone-dim);text-shadow:none;font-style:italic}
#bsBtns button.back{font-size:clamp(16px,1.5vw,22px);margin-top:10px;min-width:0}
#bsBtns button:hover{color:#e0644a;border-left-color:#c2482f}
#bsBtns button::after{box-shadow:0 0 16px 2px #c2482f}

/* ---------- pannelli ---------- */
.panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(4,5,3,.74);opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s;z-index:20}
.panel.open{opacity:1;visibility:visible;transition:opacity .35s ease}
.sheet{position:relative;width:min(940px,100%);max-height:calc(100vh - 32px);overflow:auto;background:linear-gradient(180deg,#191c15,#0f110d);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.75),inset 0 0 0 6px #0b0c09,inset 0 0 0 7px #2a2d23;padding:clamp(20px,3vw,38px);transform:translateY(18px) scale(.985);transition:transform .45s cubic-bezier(.2,.8,.2,1);scrollbar-color:#3a3d31 transparent}
.panel.open .sheet{transform:none}
.sheet.small{width:min(540px,100%)}
.sheet h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,3.4vw,46px);color:var(--sodium);letter-spacing:.03em;margin-bottom:.35em;line-height:1}
.sheet p{line-height:1.6;max-width:66ch}
.sheet .lead{color:var(--bone-dim);font-style:italic;margin-bottom:18px}
.center{text-align:center}
.center p{margin-left:auto;margin-right:auto}
.btn{font-family:var(--display);font-size:clamp(17px,1.6vw,21px);letter-spacing:.06em;padding:.5em 1.15em;border:1px solid #4a4c3e;background:#1d2018;color:var(--bone);transition:background .2s,color .2s,border-color .2s}
.btn:hover{border-color:var(--sodium);color:var(--sodium)}
.btn.primary{background:var(--sodium);color:#1a1206;border-color:var(--sodium)}
.btn.primary:hover{background:#efb04a;color:#1a1206}
.btn:disabled{opacity:.32;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.row.center{justify-content:center}
.back{margin-top:24px}
.panel.red .sheet{background:linear-gradient(180deg,#1c1311,#0e0908);border-color:#3d2420;box-shadow:0 30px 80px rgba(0,0,0,.8),inset 0 0 0 6px #0b0706,inset 0 0 0 7px #3a201b}
.panel.red .sheet h2{color:#d0583c}

/* notti */
.nights{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.night{padding:14px 8px;border:1px solid #3d2a24;background:#140e0c;text-align:center;transition:border-color .2s,background .2s}
.night:hover:not(:disabled){border-color:#c2482f;background:#21140f}
.night b{display:block;font-family:var(--display);font-weight:400;font-size:30px;color:#d0583c;line-height:1}
.night span{display:block;margin-top:6px;font-size:14px;color:var(--bone);line-height:1.25}
.night small{display:block;margin-top:4px;font-size:12px;color:var(--bone-dim)}
.night:disabled{opacity:.3;cursor:not-allowed}

/* custom night */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.crow{display:grid;grid-template-columns:70px 1fr;gap:12px;align-items:center;padding:10px;border:1px solid #3d2a24;background:#120c0a}
.crow canvas{width:70px;height:75px;display:block;background:#080605}
.crow h3{font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.04em;line-height:1.1}
.lvl{display:grid;grid-template-columns:34px 1fr 34px 42px;gap:6px;align-items:center;margin-top:8px}
.lvl button{height:30px;border:1px solid #4a3a32;background:#1d1411;font-family:var(--display);font-size:20px;line-height:1;color:var(--bone)}
.lvl button:hover{border-color:#c2482f;color:#e0644a}
.lvl input[type=range]{accent-color:#c2482f}
.lvl output{font-family:var(--display);font-size:24px;color:#d0583c;text-align:right}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 16px}
.presets .btn{font-size:15px;padding:.4em .8em}
.note{font-size:14px;color:var(--bone-dim);font-style:italic;margin-top:12px}

/* mostri */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.mcard{background:#0c0e0a;border:1px solid #2b2e24;display:flex;flex-direction:column}
.mcard canvas{display:block;width:100%;height:auto;aspect-ratio:300/320;border-bottom:1px solid #2b2e24}
.mcard .txt{padding:14px 16px 18px}
.mcard h3{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em;color:var(--bone)}
.mcard .role{font-size:14px;font-style:italic;color:var(--bone-dim);margin:2px 0 8px}
.mcard p{font-size:15px;line-height:1.5}

#mapCanvas{display:block;width:100%;height:auto;background:#050806;border:1px solid #2b2e24}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 18px;margin-top:14px;font-size:15px;color:var(--bone-dim)}
.legend b{font-family:var(--mono);color:var(--crt);margin-right:6px}

.set{display:grid;grid-template-columns:minmax(150px,1fr) minmax(140px,280px) 58px;align-items:center;gap:14px 16px}
.set label{font-size:16px}
.set output{font-family:var(--mono);color:var(--sodium);text-align:right}
.set select{grid-column:2 / 4;border:1px solid #4a4c3e;background:#1d2018;padding:7px 10px;font-size:16px;color:var(--bone)}
input[type=range]{width:100%;accent-color:var(--sodium);height:22px;cursor:pointer}

.keys{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;align-items:baseline}
kbd{font-family:var(--mono);font-weight:700;font-size:14px;color:#140e05;background:var(--bone);border-radius:3px;padding:2px 7px;box-shadow:0 2px 0 #6b6553;white-space:nowrap;display:inline-block;margin:0 2px 4px 0}
.keys dd{line-height:1.5}
.tips{margin-top:20px;padding-top:16px;border-top:1px solid #2b2e24}
.tips p{margin-bottom:8px;color:var(--bone-dim);font-size:15px}

#p-credits{background:rgba(0,0,0,.15);overflow:hidden;padding:0}
#p-credits .roll{position:absolute;left:50%;top:100%;width:min(640px,90vw);text-align:center;transform:translate(-50%,0)}
#p-credits.open .roll{animation:roll 52s linear infinite}
@keyframes roll{from{transform:translate(-50%,0)}to{transform:translate(-50%,calc(-100vh - 100%))}}
.roll h3{font-family:var(--display);font-weight:400;font-size:clamp(40px,5.4vw,72px);color:var(--sodium);line-height:1;text-shadow:0 0 24px rgba(0,0,0,.9);padding-bottom:18vh}
.roll .block{padding:20vh 0}
.roll .role{font-family:var(--body);font-variant:small-caps;letter-spacing:.14em;color:var(--sodium);font-size:clamp(17px,1.6vw,22px)}
.roll .name{font-family:var(--display);font-size:clamp(30px,3.4vw,46px);letter-spacing:.05em;color:var(--bone);text-shadow:0 2px 12px #000;margin-top:14px}
.roll .sep{width:240px;height:1px;margin:0 auto;background:linear-gradient(90deg,transparent,rgba(217,152,47,.65),transparent);position:relative}
.roll .sep::after{content:"";position:absolute;left:50%;top:-4px;width:8px;height:8px;background:#d9982f;transform:translateX(-50%) rotate(45deg)}
.roll .end{padding:24vh 0 12vh;font-style:italic;color:var(--bone-dim);font-size:18px}
#credBack{position:absolute;left:clamp(14px,2.2vw,30px);top:clamp(14px,2.2vh,26px);z-index:2}

#overName{color:var(--sodium)}
#p-settings{background:transparent;align-items:flex-end;padding:0 2vw 2vh}
#p-settings .sheet{background:none;border:0;box-shadow:none;width:min(1120px,96vw);max-height:76vh;overflow:visible;padding:0;transform:perspective(1300px) rotateX(24deg) translateY(40px);transform-origin:50% 100%}
#p-settings.open .sheet{transform:perspective(1300px) rotateX(24deg)}
#p-settings h2{display:inline-block;background:#b9ad8a;color:#3a1a10;padding:.2em .6em;transform:rotate(-2deg);box-shadow:0 8px 14px rgba(0,0,0,.6);font-size:clamp(26px,3vw,40px);margin-bottom:18px}
#p-settings .sheet{display:flex;flex-wrap:wrap;align-items:center;gap:0 18px}
#p-settings .row.back{margin:0 0 18px;order:1}
#p-settings h2{order:0}
#setGrid{order:2;flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 20px}
.card{position:relative;padding:13px 14px 9px;background:#d6c9ab;color:#2a2018;box-shadow:0 12px 18px rgba(0,0,0,.65);transform:rotate(var(--r,0deg))}
.card::before{content:"";position:absolute;left:50%;top:-8px;width:54px;height:16px;transform:translateX(-50%) rotate(-3deg);background:rgba(220,210,170,.55)}
.card.metal{background:linear-gradient(#55574f,#2e302b);color:#e6dcc4;border:1px solid #191a17}
.card.metal::before{width:9px;height:9px;border-radius:50%;background:#8a8c84;left:12px;top:8px;transform:none}
.card label{display:block;font-family:var(--display);font-size:17px;letter-spacing:.03em;margin-bottom:8px;padding-right:50px}
.card output{position:absolute;right:12px;top:14px;font-family:var(--mono);font-weight:700;color:#8e2a1c}
.card.metal output{color:#e0b060}
.card input[type=range]{accent-color:#8e2a1c}
.card select{width:100%;background:#efe6d2;border:1px solid #6b5a40;color:#2a2018;padding:6px;font-size:15px}
#p-settings .row .btn{background:#2a1d14;border-color:#6b4a2a;transform:rotate(1.2deg)}
@media (max-width:640px){#p-settings .sheet,#p-settings.open .sheet{transform:none;max-height:calc(100vh - 32px);overflow:auto}}
#bsBtns button.locked{opacity:.5}
#bsBtns button.locked:hover{transform:rotateY(22deg);color:var(--bone);border-left-color:#4a4a3a}
#bsBtns button.shake{animation:shake .35s}
@keyframes shake{25%{transform:rotateY(22deg) translateX(-6px)}75%{transform:rotateY(22deg) translateX(6px)}}
.clock6{font-family:var(--display);font-size:clamp(90px,14vw,170px);line-height:1;height:1em;overflow:hidden;display:inline-block;vertical-align:top;color:var(--bone)}
.clock6 .col{display:flex;flex-direction:column;transition:transform 1s cubic-bezier(.7,0,.2,1) .9s}
.clock6 .col span{height:1em;display:block}
#p-win.open .clock6 .col{transform:translateY(-1em)}
.am{display:inline-block;font-family:var(--display);font-size:clamp(46px,6vw,80px);color:var(--sodium);margin-left:.15em;vertical-align:top;margin-top:.35em}

@media (max-width:640px){
  .nights{grid-template-columns:repeat(2,1fr)}
  .set{grid-template-columns:1fr 64px}
  .set input{grid-column:1 / -1;order:3}
  .set select{grid-column:1 / -1}
  .tilted{top:auto;bottom:64px}
  .tilted button{font-size:22px;min-width:170px}
  #hint{bottom:auto;top:46%}
}
@media (prefers-reduced-motion:reduce){
  .flk,#hint{animation:none}
  #p-credits.open .roll{animation-duration:60s}
  .sheet,.tilted button{transition:none}
}
</style>
</head>
<body>
<canvas id="game" aria-label="Five night's Under Ground"></canvas>

<div id="menu" class="screen hidden">
  <h1 id="title" aria-label="Five night's Under Ground"><span class="t1">Five night's</span><span class="t2">Under Ground</span><span class="soil"></span></h1>
  <nav class="tilted" id="menuBtns">
    <button style="--i:0" data-act="play" data-i18n="play"></button>
    <button style="--i:1" data-open="p-monsters" data-i18n="monsters"></button>
    <button style="--i:2" data-open="p-map" data-i18n="map"></button>
    <button style="--i:3" data-act="settings" data-i18n="settings"></button>
    <button style="--i:4" data-open="p-credits" data-i18n="credits"></button>
    <button style="--i:5" data-open="p-guide" data-i18n="guide"></button>
  </nav>
  <div id="sig">Simone Merola • 2026</div>
</div>
<div id="hint" data-i18n="audioHint"></div>

<div id="backstage" class="screen hidden">
  <div class="head"><h2 data-i18n="bsTitle"></h2><p data-i18n="bsLead"></p></div>
  <nav class="tilted" id="bsBtns">
    <button style="--i:0" id="bNew"><span data-i18n="newGame"></span><small data-i18n="newGameSub"></small></button>
    <button style="--i:1" id="bCont"><span data-i18n="continue"></span><small id="contSub"></small></button>
    <button style="--i:2" id="bCustom"><span data-i18n="custom"></span><small id="custSub"></small></button>
    <button style="--i:3" id="bBack" class="back" data-i18n="back"></button>
  </nav>
</div>

<section class="panel red" id="p-nights">
  <div class="sheet">
    <h2 data-i18n="continue"></h2>
    <p class="lead" id="nightsLead"></p>
    <div class="nights" id="nights"></div>
    <div class="row back"><button class="btn" data-close data-i18n="back"></button></div>
  </div>
</section>

<section class="panel red" id="p-custom">
  <div class="sheet" style="width:min(1000px,100%)">
    <h2 data-i18n="custom"></h2>
    <p class="lead" data-i18n="customSub"></p>
    <div class="presets" id="presets"></div>
    <div class="cgrid" id="cgrid"></div>
    <p class="note" data-i18n="bollenteNote"></p>
    <div class="row back"><button class="btn primary" id="custStart" data-i18n="custStart"></button><button class="btn" data-close data-i18n="back"></button></div>
  </div>
</section>

<section class="panel" id="p-monsters">
  <div class="sheet" style="width:min(1180px,100%)">
    <h2 data-i18n="monstersT"></h2>
    <p class="lead" data-i18n="monstersLead"></p>
    <div class="mgrid" id="mgrid"></div>
    <div class="row back"><button class="btn" data-close data-i18n="back"></button></div>
  </div>
</section>

<section class="panel" id="p-map">
  <div class="sheet" style="width:min(1000px,100%)">
    <h2 data-i18n="mapTitle"></h2>
    <canvas id="mapCanvas" width="1000" height="780"></canvas>
    <div class="legend" id="legend"></div>
    <div class="row back"><button class="btn" data-close data-i18n="back"></button></div>
  </div>
</section>

<section class="panel" id="p-settings">
  <div class="sheet small" style="width:min(660px,100%)">
    <h2 data-i18n="settingsT"></h2>
    <div id="setGrid"></div>
    <div class="row back"><button class="btn" id="setReset" data-i18n="reset"></button><button class="btn" data-close data-i18n="back"></button></div>
  </div>
</section>

<section class="panel" id="p-credits">
  <button class="btn" id="credBack" data-close data-i18n="back"></button>
  <div class="roll">
    <h3>Five night's<br>Under Ground</h3>
    <div class="sep"></div>
    <div class="block"><div class="role" data-i18n="crFounder"></div><div class="name">Simone Merola</div></div>
    <div class="sep"></div>
    <div class="block"><div class="role" data-i18n="crProg"></div><div class="name">Simone Merola</div></div>
    <div class="sep"></div>
    <div class="block"><div class="role" data-i18n="crMon"></div><div class="name">Simone Merola</div></div>
    <div class="sep"></div>
    <div class="block"><div class="role" data-i18n="crSound"></div><div class="name">Simone Merola</div></div>
    <div class="sep"></div>
    <div class="end" data-i18n="crEnd"></div>
  </div>
</section>

<section class="panel" id="p-guide">
  <div class="sheet" style="width:min(800px,100%)">
    <h2 data-i18n="guideT"></h2>
    <dl class="keys" id="keys"></dl>
    <div class="tips" id="tips"></div>
    <div class="row back"><button class="btn" data-close data-i18n="back"></button></div>
  </div>
</section>

<section class="panel" id="p-confirm" role="alertdialog" aria-labelledby="cTitle">
  <div class="sheet small center">
    <h2 id="cTitle"></h2>
    <p id="cText"></p>
    <div class="row center"><button class="btn primary" id="cYes"></button><button class="btn" id="cNo" data-i18n="cancel"></button></div>
  </div>
</section>

<section class="panel" id="p-over">
  <div class="sheet small center">
    <h2 data-i18n="caught"></h2>
    <p><span id="overText"></span> <span id="overNight"></span></p>
    <div class="row center"><button class="btn primary" id="overRetry" data-i18n="retry"></button><button class="btn" id="overMenu" data-i18n="mainMenu"></button></div>
  </div>
</section>

<section class="panel" id="p-end">

md_talpo:['Sotto le piastre consumate del petto girano ancora gli ingranaggi. La lampada sul casco non si è mai spenta. Arriva dalla porta sinistra.','Behind the worn chest plates the gears still turn. The lamp on his helmet never went out. He comes to the left door.','Tras las placas gastadas del pecho aún giran los engranajes. La lámpara de su casco nunca se apagó. Llega por la puerta izquierda.','Hinter den abgenutzten Brustplatten drehen sich noch die Zahnräder. Die Lampe an seinem Helm ist nie erloschen. Er kommt zur linken Tür.','За стёртыми пластинами груди всё ещё вращаются шестерни. Лампа на каске так и не погасла. Приходит к левой двери.'],
md_rattina:['Metà del volto è caduta e sotto c\'è il cranio di metallo. Il microfono è staccato, ma lei canta ancora. Arriva dalla porta destra.','Half her face has fallen away, showing the metal skull beneath. The microphone is unplugged, yet she still sings. She comes to the right door.','Media cara se le ha caído y debajo asoma el cráneo metálico. El micrófono está desconectado, pero sigue cantando. Llega por la puerta derecha.','Die Hälfte ihres Gesichts ist abgefallen, darunter der Metallschädel. Das Mikrofon ist ausgesteckt, doch sie singt weiter. Sie kommt zur rechten Tür.','Половина лица отвалилась, под ней металлический череп. Микрофон отключён, но она всё ещё поёт. Приходит к правой двери.'],
md_lombro:['Anelli d\'acciaio e pistoni sotto una pelle di gomma che si stacca. Striscia nel condotto fino alla ventola frontale.','Steel rings and pistons under a peeling rubber skin. He crawls through the duct to the front vent.','Anillos de acero y pistones bajo una piel de goma que se despega. Se arrastra por el conducto hasta la rejilla frontal.','Stahlringe und Kolben unter einer sich lösenden Gummihaut. Er kriecht durch den Schacht zum vorderen Gitter.','Стальные кольца и поршни под отслаивающейся резиновой кожей. Ползёт по каналу к переднему вентканалу.'],
md_gino:['Le porte non lo fermano. Quando entra nell\'ufficio, indossa subito la maschera e tienila finché non se ne va.','Doors will not stop him. When he steps into the office, put the mask on at once and keep it on until he leaves.','Las puertas no lo detienen. Cuando entre en la oficina, ponte la máscara enseguida y no te la quites hasta que se vaya.','Türen halten ihn nicht auf. Betritt er das Büro, setz sofort die Maske auf und behalte sie, bis er geht.','Двери его не остановят. Когда он войдёт в офис, сразу наденьте маску и не снимайте, пока он не уйдёт.'],
md_minatore:['Un occhio gli pende dai cavi. Resta fermo finché lo guardi sulla CAM 4: quando lascia il sipario corre lungo il Corridoio Ovest.','One eye hangs from its wires. He stays still while you watch him on CAM 4. Once he leaves the curtain, he runs down the West Corridor.','Un ojo le cuelga de los cables. No se mueve mientras lo miras en la CAM 4: cuando deja el telón corre por el pasillo oeste.','Ein Auge hängt an Kabeln herab. Er bleibt stehen, solange du ihn auf CAM 4 beobachtest. Verlässt er den Vorhang, rennt er den Westflur entlang.','Один глаз висит на проводах. Он неподвижен, пока вы смотрите на него в CAM 4. Покинув занавес, он бежит по западному коридору.'],
md_bollente:['Una caldaia con le braccia. Non lo vedrai arrivare: se la temperatura resta sopra i 100° troppo a lungo, è già nell\'ufficio.','A boiler with arms. You will not see him coming: if the temperature stays above 100° for too long, he is already in the office.','Una caldera con brazos. No lo verás llegar: si la temperatura pasa de 100° demasiado tiempo, ya está en la oficina.','Ein Heizkessel mit Armen. Du siehst ihn nicht kommen: Bleibt die Temperatur zu lange über 100°, ist er schon im Büro.','Котёл с руками. Вы не увидите, как он придёт: если температура слишком долго выше 100°, он уже в офисе.'],
md_mistero:['Nessuno sa cosa sia. Lo si intravede solo dietro Cinder, ai margini della luce.','Nobody knows what it is. It is only glimpsed behind Cinder, at the edge of the light.','Nadie sabe qué es. Solo se intuye detrás de Cinder, al borde de la luz.','Niemand weiß, was es ist. Man erahnt es nur hinter Cinder, am Rand des Lichts.','Никто не знает, что это. Его можно заметить лишь за Синдером, на краю света.']

/* =========================================================
   AUDIO
   ========================================================= */
const A={ctx:null,loops:{},lv:{}};
function initAudio(){
  if(A.ctx){if(A.ctx.state==='suspended')A.ctx.resume().catch(()=>{});return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  try{A.ctx=new AC();}catch(e){A.ctx=null;return;}
  const c=A.ctx;
  A.master=c.createGain();
  const comp=c.createDynamicsCompressor();comp.threshold.value=-10;comp.knee.value=8;comp.ratio.value=5;comp.attack.value=.003;comp.release.value=.25;
  A.master.connect(comp);comp.connect(c.destination);
  A.sfx=c.createGain();A.sfx.connect(A.master);
  A.mon=c.createGain();A.mon.connect(A.sfx);
  A.js=c.createGain();A.js.connect(A.master);
  A.music=c.createGain();A.music.connect(A.master);
  const len=c.sampleRate*2,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
  let last=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;d[i]=w;}A.noise=b;
  const bb=c.createBuffer(1,len,c.sampleRate),bd=bb.getChannelData(0);
  for(let i=0;i<len;i++){const w=Math.random()*2-1;last=(last+.02*w)/1.02;bd[i]=last*3.5;}A.brown=bb;
  applyVolumes();buildLoops();
  if(c.state==='suspended')c.resume().catch(()=>{});
  $('#hint').classList.add('gone');
  syncMusic();
}
function applyVolumes(){
  if(!A.ctx)return;const tt=A.ctx.currentTime;
  A.master.gain.setTargetAtTime(Math.pow(S.master/100,1.6),tt,.05);
  A.sfx.gain.setTargetAtTime(Math.pow(S.sfx/100,1.4),tt,.05);
  A.mon.gain.setTargetAtTime(Math.pow(S.mon/100,1.5),tt,.05);
  A.js.gain.setTargetAtTime(Math.pow(S.jump/100,1.2)*1.2,tt,.05);
  A.music.gain.setTargetAtTime(Math.pow(S.music/100,1.4),tt,.05);
}
function src(brown){const s=A.ctx.createBufferSource();s.buffer=brown?A.brown:A.noise;s.loop=true;return s;}
function envG(g,t0,a,peak,dur){g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t0+a);g.gain.exponentialRampToValueAtTime(.0001,t0+a+dur);}
function tone(o){
  if(!A.ctx)return;const c=A.ctx,t0=c.currentTime+(o.t||0),dur=o.dur||.3,a=o.a||.005;
  const os=c.createOscillator();os.type=o.type||'sine';os.frequency.setValueAtTime(o.f||440,t0);
  if(o.f2)os.frequency.exponentialRampToValueAtTime(Math.max(1,o.f2),t0+a+dur);
  if(o.det)os.detune.value=o.det;
  const g=c.createGain();envG(g,t0,a,o.vol==null?.3:o.vol,dur);
  let n=os;
  if(o.lp||o.bp||o.hp){const fl=c.createBiquadFilter();fl.type=o.lp?'lowpass':o.bp?'bandpass':'highpass';fl.frequency.value=o.lp||o.bp||o.hp;fl.Q.value=o.q||.8;n.connect(fl);n=fl;}
  if(o.vib){const l=c.createOscillator();l.frequency.value=o.vib[0];const lg=c.createGain();lg.gain.value=o.vib[1];l.connect(lg);lg.connect(os.frequency);l.start(t0);l.stop(t0+a+dur+.1);}
  if(o.pan!=null&&c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=clamp(o.pan,-1,1);n.connect(p);n=p;}
  n.connect(g);g.connect(o.dest||A.sfx);os.start(t0);os.stop(t0+a+dur+.1);
}
function noiz(o){
  if(!A.ctx)return;const c=A.ctx,t0=c.currentTime+(o.t||0),dur=o.dur||.3,a=o.a||.004;
  const s=src(o.brown);if(o.rate)s.playbackRate.value=o.rate;
  const f=c.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||1000,t0);
  if(o.f2)f.frequency.exponentialRampToValueAtTime(Math.max(20,o.f2),t0+a+dur);
  f.Q.value=o.q||1;
  if(o.fm){const l=c.createOscillator();l.frequency.value=o.fm[0];const lg=c.createGain();lg.gain.value=o.fm[1];l.connect(lg);lg.connect(f.frequency);l.start(t0);l.stop(t0+a+dur+.1);}
  const g=c.createGain();envG(g,t0,a,o.vol==null?.3:o.vol,dur);
  s.connect(f);let n=f;
  if(o.pan!=null&&c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=clamp(o.pan,-1,1);f.connect(p);n=p;}
  n.connect(g);g.connect(o.dest||A.sfx);s.start(t0,Math.random()*1.5);s.stop(t0+a+dur+.1);
}
function metal(f0,o){o=o||{};[1,1.48,2.13,2.91,3.79,5.2].forEach((m,i)=>tone({type:i%2?'triangle':'sine',f:f0*m,f2:o.bend?f0*m*o.bend:null,t:o.t||0,dur:(o.dur||1.2)/(1+i*.35),vol:(o.vol||.2)/(1+i*.5),pan:o.pan,dest:o.dest}));noiz({type:'bandpass',f:f0*4,q:2,t:o.t||0,dur:.06,vol:(o.vol||.2)*1.2,pan:o.pan,dest:o.dest});}
function bell(f,tt,v){[1,2.76,5.4,8.93].forEach((m,i)=>tone({f:f*m,t:tt,dur:2.4/(i+1),vol:v/(i+1.5)}));}
function distCurve(k){const n=1024,cur=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;cur[i]=(1+k)*x/(1+k*Math.abs(x));}return cur;}
function jsBus(drive){const c=A.ctx,ws=c.createWaveShaper();ws.curve=distCurve(drive||4);ws.oversample='2x';const g=c.createGain();g.gain.value=.8;ws.connect(g);g.connect(A.js);setTimeout(()=>{try{ws.disconnect();g.disconnect();}catch(e){}},4500);return ws;}
function mkLoop(dest){const g=A.ctx.createGain();g.gain.value=0;g.connect(dest);return g;}
function buildLoops(){
  const c=A.ctx;
  /* scantinato / pizzeria */
  const amb=mkLoop(A.music);
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=170;lp.connect(amb);
  [41.2,41.75,82.1].forEach(f=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;const og=c.createGain();og.gain.value=.1;o.connect(og);og.connect(lp);o.start();});
  const n=src(true),nf=c.createBiquadFilter();nf.type='lowpass';nf.frequency.value=260;const ng=c.createGain();ng.gain.value=.5;n.connect(nf);nf.connect(ng);ng.connect(amb);n.start();
  const h=c.createOscillator();h.type='triangle';h.frequency.value=120;const hg=c.createGain();hg.gain.value=.012;h.connect(hg);hg.connect(amb);h.start();
  const l=c.createOscillator();l.frequency.value=.07;const lg=c.createGain();lg.gain.value=55;l.connect(lg);lg.connect(lp.frequency);l.start();
  A.loops.amb=amb;
  /* backstage: cluster dissonante */
  const bk=mkLoop(A.music);
  const bl=c.createBiquadFilter();bl.type='lowpass';bl.frequency.value=380;bl.Q.value=3;bl.connect(bk);
  [73.4,77.8,110,116.5].forEach((f,i)=>{const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=(i-1.5)*9;const og=c.createGain();og.gain.value=.055;o.connect(og);og.connect(bl);o.start();});
  const bL=c.createOscillator();bL.frequency.value=.09;const bLg=c.createGain();bLg.gain.value=180;bL.connect(bLg);bLg.connect(bl.frequency);bL.start();

function updateMon(m,dt){

  const pr=$('#presets');pr.textContent='';
  const mk=(label,fn)=>{const b=document.createElement('button');b.className='btn';b.textContent=label;b.onclick=()=>{CUSTOM_IDS.forEach((id,i)=>grid.children[i]._set(fn(id)));SFX.ui();};pr.appendChild(b);};
  for(const n of[0,5,10,20])mk(t('presetAll',{n}),()=>n);
  mk(t('presetRnd'),()=>Math.floor(Math.random()*21));
}
function buildNights(){
  const wrap=$('#nights'),u=getProg();wrap.textContent='';
  for(let n=1;n<=5;n++){
    const b=document.createElement('button');b.className='night';b.disabled=n>u;
    const nb=document.createElement('b');nb.textContent=n;const nm=document.createElement('span');nm.textContent=nightName(n);const sm=document.createElement('small');sm.textContent=n>u?t('locked'):diffName(n);
    b.append(nb,nm,sm);b.addEventListener('click',()=>askConfirm(t('cContT'),t('cCont',{n,name:nightName(n),diff:diffName(n)}),t('confirm'),()=>startCutscene(n)));
    wrap.appendChild(b);
  }
  $('#nightsLead').textContent=t('nightsLead');
}
function isDone(){try{return localStorage.getItem('fnug_completed')==='1';}catch(e){return false;}}
function updateContSub(){$('#contSub').textContent=t('contSub',{n:getProg()});const d=isDone();$('#bCustom').classList.toggle('locked',!d);$('#custSub').textContent=d?t('customSub'):t('lockedCustom');}
const SETS=[['master','sMaster',0,100],['jump','sJump',0,100],['sfx','sSfx',0,100],['mon','sMon',0,100],['music','sMusic',0,100],['bright','sBright',50,150],['zoom','sZoom',100,140],['vhs','sVhs',0,100]];
function buildSettings(){
  const grid=$('#setGrid');grid.textContent='';
  const card=(i,metal)=>{const d=document.createElement('div');d.className='card'+(metal?' metal':'');d.style.setProperty('--r',((((i*37)%7)-3)*.7).toFixed(1)+'deg');grid.appendChild(d);return d;};
  const lc=card(0,false),ll=document.createElement('label');ll.htmlFor='set-lang';ll.textContent=t('sLang');
  const sel=document.createElement('select');sel.id='set-lang';for(const [code,name] of LANGS){const o=document.createElement('option');o.value=code;o.textContent=name;if(code===LANG)o.selected=true;sel.appendChild(o);}
  sel.addEventListener('change',()=>setLang(sel.value));lc.append(ll,sel);
  SETS.forEach(([k,key,mn,mx],i)=>{
    const d=card(i+1,i%3===1),id='set-'+k,lb=document.createElement('label');lb.htmlFor=id;lb.textContent=t(key);
    const inp=document.createElement('input');inp.type='range';inp.id=id;inp.min=mn;inp.max=mx;inp.step=1;inp.value=S[k];
    const out=document.createElement('output');out.htmlFor=id;out.textContent=S[k]+'%';
    inp.addEventListener('input',()=>{S[k]=+inp.value;out.textContent=S[k]+'%';saveS();applyVolumes();applyBright();});
    inp.addEventListener('change',()=>{if(!A.ctx)return;if(k==='jump')metal(300,{vol:.25,dur:.6,dest:A.js});else if(k==='mon')SFX.camUp();else SFX.ui();});
    d.append(lb,out,inp);
  });
}
function buildGuide(){
  const dl=$('#keys');dl.textContent='';
  const rows=[[['S'],'kS'],[['W'],'kW'],[['A'],'kA'],[['D'],'kD'],[['Z'],'kZ'],[[t('kSpaceK')],'kSpace'],[['Q','E'],'kQE'],[['X'],'kX'],[['1','…','9','0'],'kNum'],[[t('kMouseK')],'kMouse'],[['Esc'],'kEsc']];
  for(const [ks,d] of rows){const dt=document.createElement('dt');for(const k of ks){if(k==='…'){dt.append('… ');continue;}const kb=document.createElement('kbd');kb.textContent=k;dt.append(kb,' ');}const dd=document.createElement('dd');dd.textContent=t(d);dl.append(dt,dd);}
  const tips=$('#tips');tips.textContent='';for(const k of['tip1','tip2','tip3','tip4','tip5']){const p=document.createElement('p');p.textContent=t(k);tips.appendChild(p);}
}
function buildLegend(){const lg=$('#legend');lg.textContent='';for(const k of CAMS){const d=document.createElement('div');const b=document.createElement('b');b.textContent='CAM '+ROOMS[k];d.append(b,document.createTextNode(roomName(k)));lg.appendChild(d);}const d=document.createElement('div');const b=document.createElement('b');b.textContent=t('you');d.append(b,document.createTextNode(t('officeLong')));lg.appendChild(d);}
function applyI18n(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{el.textContent=t(el.dataset.i18n);});
  updateContSub();
}
function setLang(code){
  if(LI[code]==null)return;LANG=code;try{localStorage.setItem('fnug_lang',code);}catch(e){}
  applyI18n();buildBG();buildSettings();buildGuide();buildLegend();buildNights();
  if(portraits.length)buildMonsters();if(custP.length)buildCustom();
  if(isOpen('p-map'))drawMapPanel();
}
function applyBright(){cv.style.filter=`brightness(${clamp(S.bright,50,150)/100})`;}

/* ---------- pannelli ---------- */
let zTop=20;const stack=[];
function isOpen(id){return stack.includes(id);}
function openPanel(id){
  const p=document.getElementById(id);if(!p)return;
  p.style.zIndex=++zTop;p.classList.add('open');
  const i=stack.indexOf(id);if(i>=0)stack.splice(i,1);stack.push(id);
  if(id==='p-monsters')buildMonsters();
  if(id==='p-map'){drawMapPanel();buildLegend();}
  if(id==='p-settings')buildSettings();
  if(id==='p-nights')buildNights();
  if(id==='p-custom')buildCustom();
  if(id==='p-credits'||(id==='p-settings'&&mode==='menu'))$('#menu').classList.add('hidden');
  const f=p.querySelector('button:not([disabled]),select');if(f)setTimeout(()=>{try{f.focus({preventScroll:true});}catch(e){}},60);
  SFX.ui();
}
function closePanel(id){const p=document.getElementById(id);if(!p)return;p.classList.remove('open');const i=stack.indexOf(id);if(i>=0)stack.splice(i,1);if((id==='p-credits'||id==='p-settings')&&mode==='menu'){$('#menu').classList.remove('hidden');if(id==='p-settings'){TRANS=.9;SFX.trans();}}}
function closeAll(){[...stack].forEach(closePanel);}
function closeTop(){const id=stack[stack.length-1];if(!id)return false;if(id==='p-over'||id==='p-win'||id==='p-end')return true;if(id==='p-confirm')confirmCb=null;closePanel(id);SFX.ui();return true;}
let confirmCb=null;
function askConfirm(title,text,yes,cb){$('#cTitle').textContent=title;$('#cText').textContent=text;$('#cYes').textContent=yes||t('confirm');confirmCb=cb;openPanel('p-confirm');}
$('#cYes').addEventListener('click',()=>{const cb=confirmCb;confirmCb=null;closePanel('p-confirm');if(cb)cb();});
$('#cNo').addEventListener('click',()=>{confirmCb=null;closePanel('p-confirm');SFX.ui();});

document.querySelectorAll('#menuBtns button').forEach(b=>{
  b.addEventListener('click',()=>{initAudio();const a=b.dataset.act;if(a==='play')transTo(goBackstage);else if(a==='settings')transTo(()=>openPanel('p-settings'));else openPanel(b.dataset.open);});
  b.addEventListener('mouseenter',()=>SFX.hover());
});
document.querySelectorAll('#bsBtns button').forEach(b=>b.addEventListener('mouseenter',()=>SFX.hover()));
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{const p=b.closest('.panel');if(p){closePanel(p.id);SFX.ui();}}));
$('#bNew').addEventListener('click',()=>askConfirm(t('cNewT'),t('cNew'),t('confirm'),()=>{setProg(1);startCutscene(1);}));
$('#bCont').addEventListener('click',()=>openPanel('p-nights'));
$('#bCustom').addEventListener('click',()=>{if(!isDone()){const b=$('#bCustom');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');SFX.ui();return;}openPanel('p-custom');});
$('#bBack').addEventListener('click',()=>transTo(goMenu));
$('#custStart').addEventListener('click',()=>askConfirm(t('cCustT'),t('cCust'),t('confirm'),()=>startCutscene('custom')));
$('#setReset').addEventListener('click',()=>{Object.assign(S,DEF);saveS();buildSettings();applyVolumes();applyBright();SFX.ui();});
$('#overRetry').addEventListener('click',()=>askConfirm(t('cRetryT'),t('cRetry'),t('confirm'),()=>startCutscene(lastNight)));
$('#overMenu').addEventListener('click',goMenu);
$('#winNext').addEventListener('click',()=>{if(lastNight===5){closeAll();startCutscene('ending');return;}const n=Math.min(5,lastNight+1);askConfirm(t('cContT'),t('cCont',{n,name:nightName(n),diff:diffName(n)}),t('confirm'),()=>startCutscene(n));});
$('#winMenu').addEventListener('click',goMenu);
$('#endBack').addEventListener('click',goBackstage);
$('#endMenu').addEventListener('click',goMenu);

/* ---------- input ---------- */
addEventListener('keydown',e=>{
  initAudio();const k=e.key;
  if((k==='v'||k==='V')&&(mode==='intro'||mode==='cutscene')){if(!vHeld)vHeld=performance.now();return;}
  if(k==='Escape'){
    e.preventDefault();
    if(mode==='game'&&!stack.length){if(!escHeld)escHeld=performance.now();return;}
    if(stack.length){closeTop();return;}
    if(mode==='backstage'){goMenu();return;}
    return;
  }
  if(mode==='cutscene'||mode==='intro')return;
  if(mode!=='game'||!G||stack.length)return;
  if(k===' ')e.preventDefault();
  if(e.repeat)return;
  const kl=k.toLowerCase();
  if(kl==='s')toggleCam();
  else if(kl==='w')toggleVent();
  else if(kl==='a')toggleDoor('L');
  else if(kl==='d')toggleDoor('R');
  else if(kl==='z')toggleZ();
  else if(k===' ')toggleFan();
  else if(kl==='q')setLight('L');
  else if(kl==='e')setLight('R');
  else if(kl==='x')toggleMask();
  else if(/^[0-9]$/.test(k)&&G.cam){switchCam(CAMS[k==='0'?9:parseInt(k,10)-1]);}
});
addEventListener('keyup',e=>{if(e.key==='Escape')escHeld=null;if(e.key==='v'||e.key==='V')vHeld=null;});
addEventListener('pointermove',e=>{P_.x=e.clientX*DPR;P_.y=e.clientY*DPR;P_.inside=true;});
document.addEventListener('pointerleave',()=>{P_.inside=false;});
addEventListener('blur',()=>{P_.inside=false;escHeld=null;});
addEventListener('pointerdown',()=>initAudio(),{capture:true});
cv.addEventListener('pointerdown',e=>{
  P_.x=e.clientX*DPR;P_.y=e.clientY*DPR;P_.inside=true;
  if(mode==='cutscene'||mode==='intro')return;
  if(mode!=='game'||!G||stack.length)return;
  const px=P_.x,py=P_.y;
  for(const b of(G.bars||[])){if(px>=b.x&&px<=b.x+b.w&&py>=b.y-6*DPR&&py<=b.y+b.h){if(!b.dis)b.act();return;}}
  if(G.cam&&G.camAnim>.9){for(const m of G.mapBtns){if(px>=m.x&&px<=m.x+m.w&&py>=m.y&&py<=m.y+m.h){switchCam(m.room);return;}}return;}
  if(G.cam||G.mask)return;
  const o=hitObj(px,py);if(o&&(canAct()||o.id==='plush'))o.act();
});
document.addEventListener('visibilitychange',()=>{if(G)G.frozen=document.hidden;escHeld=null;});
addEventListener('resize',resize);

/* =========================================================
   AVVIO
   ========================================================= */
function init(){
  for(let i=0;i<4;i++){const n=mkCanvas(320,180),nx=n.getContext('2d'),im=nx.createImageData(320,180);for(let p=0;p<im.data.length;p+=4){const v=Math.random()*255|0;im.data[p]=im.data[p+1]=im.data[p+2]=v;im.data[p+3]=255;}nx.putImageData(im,0,0);NOISE.push(n);}
  buildBG();
  const t2=$('#title .t2'),txt='Under Ground',r=rng(7);t2.textContent='';
  [...txt].forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch===' '?' ':ch;s.style.transform=`translateY(${(r()*.14).toFixed(3)}em) rotate(${((r()-.5)*5).toFixed(2)}deg)`;if(i===8)s.className='flk';t2.appendChild(s);});
  applyI18n();buildSettings();buildGuide();applyBright();resize();
  mode='intro';INTRO={t:0,cues:{}};showScreen(null);
  let last=performance.now();
  function loop(ts){
    const dt=Math.min(.05,Math.max(0,(ts-last)/1000));last=ts;T+=dt;
    try{
      TRANS=Math.max(0,TRANS-dt*2.4);
      if(mode==='intro')updateIntro(dt);
      else if(mode==='menu')updateMenu(dt);
      else if(mode==='backstage')updateBackstage(dt);
      else if(mode==='cutscene')updateCutscene(dt);
      else if(mode==='game'&&G){
        if(escHeld&&performance.now()-escHeld>=2000){escHeld=null;goMenu();}
        else if(!G.frozen){updateGame(dt);
          if(mode==='game'){hoverObj=(!G.cam&&!G.mask&&P_.inside)?hitObj(P_.x,P_.y):null;const onBar=(G.bars||[]).some(b=>P_.x>=b.x&&P_.x<=b.x+b.w&&P_.y>=b.y-6*DPR&&P_.y<=b.y+b.h);cv.style.cursor=(hoverObj||onBar)?'pointer':'';}}
      }
      else if(mode==='jumpscare'&&J){J.t+=dt;if(J.t>1.7){mode='over';$('#overText').textContent=t('foundBy',{name:monName(J.id)});$('#overNight').textContent=(lastNight==='custom'?t('nC'):t('night',{n:lastNight}))+', '+hourLabel()+'.';openPanel('p-over');}}
      render();
    }catch(err){console.error(err);}
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
init();
</script>
